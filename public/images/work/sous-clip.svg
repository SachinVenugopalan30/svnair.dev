<text x="580" y="210" fill="#1f2937" font-size="50" font-weight="800">One-pan chilli garlic noodles</text><text x="580" y="260" fill="#6b7280" font-size="24">Serves 2 · 15 min · extracted from a 42-second clip</text>
<text x="580" y="340" fill="#1f2937" font-size="28" font-weight="700">Ingredients</text>
<g fill="#374151" font-size="24"><text x="580" y="390">• 200 g wheat noodles</text><text x="580" y="432">• 4 cloves garlic, minced</text><text x="580" y="474">• 1 tbsp chilli flakes</text><text x="580" y="516">• 2 tbsp soy sauce, 1 tsp sugar</text><text x="580" y="558">• 2 spring onions</text></g>
<text x="580" y="640" fill="#1f2937" font-size="28" font-weight="700">Method</text>
<g fill="#374151" font-size="24"><text x="580" y="690">1  Boil noodles, keep a splash of water.</text><text x="580" y="732">2  Pour hot oil over garlic and chilli.</text><text x="580" y="774">3  Toss everything, finish with spring onion.</text></g>
